[workspace]
resolver = "2"
members = [
    "crates/*",
    "apps/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
roulette-domain = { path = "crates/roulette-domain" }
roulette-core = { path = "crates/roulette-core" }
roulette-host = { path = "crates/roulette-host" }
roulette-renderer = { path = "crates/roulette-renderer" }
roulette-backend = { path = "apps/roulette-backend" }
resvg = "0.48"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
rmcp = { version = "3.4.0", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = { version = "1.0", features = ["derive"] }

